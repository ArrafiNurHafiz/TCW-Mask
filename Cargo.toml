[package]
name = "tcw-mask"
version = "0.1.0"
edition = "2021"
authors = ["Arrafi Nur Hafiz <porto.rapydev.my.id>"]
description = "Threshold Cryptographic Wrapping with Constant-Time Masking"
license = "MIT OR Apache-2.0"

[dependencies]
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["rand_core", "digest"] }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_core = { version = "0.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bench]]
name = "timing_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
